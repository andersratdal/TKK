<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Påmelding skøyteskole med kode</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --primary: #0f766e;
      --primary-dark: #115e59;
      --danger: #b91c1c;
      --success: #166534;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    p {
      line-height: 1.5;
    }

    .muted {
      color: var(--muted);
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid-2 {
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input, select, button, textarea {
      font: inherit;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
    }

    input[type="checkbox"] {
      width: auto;
      margin-right: 8px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      margin-top: 10px;
    }

    .child-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-top: 18px;
      background: #fcfcfd;
    }

    .child-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-danger {
      background: #fee2e2;
      color: var(--danger);
    }

    .message {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      display: none;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .message.success {
      display: block;
      background: #f0fdf4;
      color: var(--success);
      border: 1px solid #bbf7d0;
    }

    .required {
      color: var(--danger);
    }

    .small {
      font-size: 0.95rem;
    }

    .loading {
      opacity: 0.7;
      pointer-events: none;
    }
  
    .app-header {
      max-width: 900px;
      margin: 0 auto 18px;
      padding: 24px 16px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .brand img {
      height: 44px;
      width: auto;
      object-fit: contain;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #003a8f;
      font-weight: 700;
    }

    .brand-title {
      font-size: 30px;
      font-weight: 700;
      color: #132238;
      line-height: 1.1;
      margin: 0;
    }

    .brand-subtitle {
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .app-header {
        padding-top: 14px;
      }

      .brand {
        margin-bottom: 10px;
        align-items: flex-start;
      }

      .brand img {
        height: 34px;
      }

      .brand-title {
        font-size: 22px;
      }

      .brand-subtitle,
      .eyebrow {
        display: none;
      }
    }

.language-switch{position:absolute;top:20px;right:24px;display:flex;gap:8px;z-index:10}.language-switch a{display:inline-flex;align-items:center;justify-content:center;width:38px;height:30px;border-radius:7px;text-decoration:none;font-size:22px;border:1px solid #d1d5db;background:#fff;box-shadow:0 2px 7px rgba(0,0,0,.08)}.language-switch a.active{border:2px solid #003a8f}body{position:relative}@media(max-width:600px){.language-switch{top:10px;right:12px}}.card,.container,.form-card,.wrap{position:relative}.language-switch{position:absolute;top:16px;right:18px;display:flex;gap:7px;align-items:center;z-index:5}.language-switch a{display:inline-flex;align-items:center;justify-content:center;width:38px;height:30px;border-radius:7px;text-decoration:none;font-size:21px;line-height:1;border:1px solid #d1d5db;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.07)}.language-switch a.active{border:2px solid #003a8f}
    .language-switch{
      position:absolute;
      top:14px;
      right:18px;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:5px;
      z-index:5;
    }
    .language-switch-label{
      font-size:10px;
      line-height:1;
      font-weight:600;
      color:#64748b;
      letter-spacing:.03em;
    }
    .language-switch-flags{
      display:flex;
      gap:7px;
      align-items:center;
    }
    .language-switch a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:38px;
      height:28px;
      padding:3px;
      box-sizing:border-box;
      border-radius:6px;
      text-decoration:none;
      border:1px solid #d1d5db;
      background:#fff;
      box-shadow:0 2px 6px rgba(0,0,0,.07);
    }
    .language-switch a.active{
      border:2px solid #003a8f;
    }
    .language-switch svg{
      display:block;
      width:100%;
      height:100%;
      border-radius:2px;
    }
    

    .child-extra-field {
      grid-column: 1 / -1;
      margin-top: 18px;
    }
    .child-extra-field > label {
      display: block;
      margin-bottom: 10px;
    }
    .child-extra-field .checkbox-row {
      margin-top: 0;
      gap: 28px !important;
    }
    

    .language-heading{display:block;margin:0 0 14px 0;font-weight:700}
    .child-extra-field{margin-top:26px!important}
    .child-extra-field + .child-extra-field{margin-top:30px!important}
    
    /* Tydelig inndeling mellom skøyter, språk og annen informasjon */
    .child-extra-field{
      grid-column:1 / -1;
      margin-top:18px !important;
      padding-top:22px;
      border-top:1px solid #dbe3ee;
    }
    .child-extra-field:first-of-type{
      margin-top:10px !important;
    }
    .child-extra-field > label,
    .child-extra-field .language-heading{
      display:block;
      margin:0 0 12px 0;
      font-weight:700;
      color:#0f172a;
    }
    .child-extra-field .checkbox-row{
      margin-top:10px;
    }
    .child-extra-field textarea{
      margin-top:2px;
    }


    /* Ekstra luft mellom "Har egne skøyter" og språkseksjonen */
    .child-extra-field:has(.preferred-language) {
      margin-top: 38px !important;
      padding-top: 26px;
    }


    /* Fast avstand mellom skøytevalg og språkoverskrift */
    .language-heading {
      display: block !important;
      margin-top: 34px !important;
      margin-bottom: 16px !important;
      padding-top: 22px !important;
      border-top: 1px solid #dbe3ee;
    }


    .language-heading {
      margin-bottom: 6px !important;
    }
    .language-heading + .checkbox-row {
      margin-top: 0 !important;
    }
    

    /* Språkoverskrift uten linje og tettere på valgene */
    .language-heading {
      border-top: none !important;
      padding-top: 0 !important;
      margin-bottom: 0 !important;
    }
    .language-heading + .checkbox-row {
      margin-top: -4px !important;
    }


    /* Skillelinjen skal ligge mellom skøyter og språk, ikke under språkoverskriften */
    .language-heading {
      border: 0 !important;
      border-top: 0 !important;
      border-bottom: 0 !important;
      text-decoration: none !important;
      padding-top: 0 !important;
      margin-top: 0 !important;
      margin-bottom: 2px !important;
    }

    .child-extra-field:has(.preferred-language) {
      border-top: 1px solid #dbe3ee !important;
      padding-top: 24px !important;
      margin-top: 34px !important;
    }

    .language-heading + .checkbox-row {
      margin-top: 0 !important;
    }


    /* Endelig seksjonsinndeling: linjen ligger mellom skøyter og språk */
    .child-extra-field:has(.preferred-language) {
      position: relative;
      border-top: none !important;
      padding-top: 30px !important;
      margin-top: 30px !important;
    }

    .child-extra-field:has(.preferred-language)::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: #dbe3ee;
    }

    .language-heading {
      border: none !important;
      padding: 0 !important;
      margin: 0 0 4px 0 !important;
      text-decoration: none !important;
    }

    .language-heading + .checkbox-row {
      margin-top: 0 !important;
    }


    /* Eksplisitt struktur for skøyter / språk / annen informasjon */
    .child-section {
      grid-column: 1 / -1;
      border: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .child-section-skates {
      margin-top: 10px !important;
    }

    .child-section-language {
      margin-top: 0 !important;
    }

    .child-section-info {
      margin-top: 0 !important;
    }

    .child-section-divider {
      grid-column: 1 / -1;
      height: 1px;
      background: #dbe3ee;
      margin: 26px 0 22px;
    }

    .child-section-language > div,
    .child-section-language > label,
    .child-section-language .language-heading {
      border: 0 !important;
      border-top: 0 !important;
      border-bottom: 0 !important;
      text-decoration: none !important;
    }

    .child-section-language label {
      margin-bottom: 6px !important;
    }

    .child-section-language .checkbox-row {
      margin-top: 0 !important;
      gap: 28px !important;
    }

    .child-section-info label {
      margin-bottom: 10px !important;
    }
    

    /* Ren og eksplisitt layout for barneseksjonen */
    .child-wide-section{
      grid-column:1 / -1;
      margin:0 !important;
      padding:0 !important;
      border:0 !important;
    }

    .section-separator{
      height:1px;
      background:#dbe3ee;
      margin:24px 0 20px;
    }

    .child-wide-section > label{
      display:block;
      margin:0 0 10px 0 !important;
      padding:0 !important;
      border:0 !important;
      text-decoration:none !important;
      font-weight:700;
    }

    .own-skates-row{
      display:flex !important;
      align-items:center;
      gap:10px;
      margin-top:10px !important;
      margin-bottom:0 !important;
      font-weight:400 !important;
    }

    .own-skates-row input{
      width:auto;
      margin:0;
    }

    .language-options{
      display:flex;
      gap:34px;
      align-items:flex-start;
      margin-top:2px;
    }

    .language-options label{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
      margin:0 !important;
      font-weight:400 !important;
    }

    .language-options input{
      width:auto;
      margin:0;
    }

    .child-wide-section textarea{
      width:100%;
      min-height:110px;
    }
    

    .child-section-skates select,
    .child-wide-section .requested-skate-size {
      margin-bottom: 16px !important;
    }

    .own-skates-row {
      margin-top: 4px !important;
    }
    
</style>
</head>
<body>
<div class="app-header">
    <div class="brand">
      <img alt="Trondheim Kortbaneklubb" src="logo.png"/>
      <div class="brand-text">
        <div class="eyebrow">Trondheim Kortbaneklubb</div>
        <h1 class="brand-title">Skøyteskole</h1>
        
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card"><div class="language-switch" aria-label="Velg språk">
      <div class="language-switch-label">Language</div>
      <div class="language-switch-flags">
        <a href="pamelding-kode.html" class="active" title="Norsk" aria-label="Norsk"><svg viewBox="0 0 22 16" aria-hidden="true">
<rect width="22" height="16" fill="#BA0C2F"/>
<rect x="6" width="4" height="16" fill="#fff"/>
<rect y="6" width="22" height="4" fill="#fff"/>
<rect x="7" width="2" height="16" fill="#00205B"/>
<rect y="7" width="22" height="2" fill="#00205B"/>
</svg></a>
        <a href="pamelding-kode-en.html" title="English" aria-label="English"><svg viewBox="0 0 60 30" aria-hidden="true">
<rect width="60" height="30" fill="#012169"/>
<path d="M0 0l60 30M60 0L0 30" stroke="#fff" stroke-width="6"/>
<path d="M0 0l60 30M60 0L0 30" stroke="#C8102E" stroke-width="2"/>
<path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/>
<path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/>
</svg></a>
      </div>
    </div>
      <h1>Påmelding til TKKs skøyteskole</h1>
      <p class="muted">
        For å melde deg på via denne siden må du ha fått en påmeldingskode fra Idrettsrådet i Trondheim. Skriv inn koden og fyll ut skjemaet under for å registrere påmeldingen.
      </p>

      <form id="signupForm">
        <div class="grid grid-2">
          <div>
            <label for="access_code">Kode <span class="required">*</span></label>
            <input id="access_code" name="access_code" type="text" required />
          </div>

          <div>
            <label for="email">E-post <span class="required">*</span></label>
            <input id="email" name="email" type="email" required />
          </div>

          <div>
            <label for="phone">Telefon <span class="required">*</span></label>
            <input id="phone" name="phone" type="tel" required />
          </div>
        </div>

        <div id="childrenContainer"></div>

        <div class="actions">
          <button type="button" class="btn-secondary" id="addChildBtn">Legg til barn</button>
          <button type="submit" class="btn-primary" id="submitBtn">Send påmelding</button>
        </div>

        <div id="message" class="message"></div>
      </form>
    </div>
  </div>

  <template id="childTemplate">
    <div class="child-card">
      <div class="child-header">
        <h3>Barn <span class="child-number"></span></h3>
        <button type="button" class="btn-danger remove-child-btn">Fjern</button>
      </div>

      <div class="grid grid-2">
        <div>
          <label>Fornavn <span class="required">*</span></label>
          <input type="text" class="child-first-name" autocomplete="given-name" required />
        </div>

        <div>
          <label>Etternavn <span class="required">*</span></label>
          <input type="text" class="child-last-name" autocomplete="family-name" required />
        </div>

        <div>
          <label>Fødselsdato <span class="required">*</span></label>
          <input type="date" class="birth-date" required />
        </div>

        <div class="child-wide-section">
          <div class="section-separator"></div>
          <label>Ønsket skøytestørrelse</label>
          <select class="requested-skate-size">
            <option value="">Velg størrelse</option>
            <option value="28">28</option>
            <option value="29">29</option>
            <option value="30">30</option>
            <option value="31">31</option>
            <option value="32">32</option>
            <option value="33">33</option>
            <option value="34">34</option>
            <option value="35">35</option>
            <option value="36">36</option>
            <option value="37">37</option>
            <option value="38">38</option>
            <option value="39">39</option>
            <option value="40">40</option>
            <option value="41">41</option>
            <option value="42">42</option>
            <option value="43">43</option>
            <option value="44">44</option>
            <option value="45">45</option>
          </select>

          <label class="own-skates-row">
            <input type="checkbox" class="has-own-skates" />
            <span>Har egne skøyter</span>
          </label>
        </div>

        <div class="child-wide-section">
          <div class="section-separator"></div>
          <label>Ønsket språk for deltager <span class="required">*</span></label>
          <div class="language-options">
            <label>
              <input type="radio" class="preferred-language" name="preferred-language-template" value="Norsk" required />
              <span>Norsk</span>
            </label>
            <label>
              <input type="radio" class="preferred-language" name="preferred-language-template" value="Engelsk" required />
              <span>Engelsk</span>
            </label>
          </div>
        </div>

        <div class="child-wide-section">
          <div class="section-separator"></div>
          <label>Annen informasjon</label>
          <textarea class="other-information" rows="4" placeholder="Valgfritt"></textarea>
        </div>
      </div>
    </div>
  </template>

  <script>
    const ACTIVE_BATCH_NAME = "Høst 2026";

    const form = document.getElementById("signupForm");
    const childrenContainer = document.getElementById("childrenContainer");
    const addChildBtn = document.getElementById("addChildBtn");
    const submitBtn = document.getElementById("submitBtn");
    const messageBox = document.getElementById("message");
    const childTemplate = document.getElementById("childTemplate");

    function showMessage(text, type = "error") {
      messageBox.textContent = text;
      messageBox.className = `message ${type}`;
    }

    function clearMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    function updateChildNumbers() {
      const cards = childrenContainer.querySelectorAll(".child-card");
      cards.forEach((card, index) => {
        const numberEl = card.querySelector(".child-number");
        const removeBtn = card.querySelector(".remove-child-btn");
        numberEl.textContent = index + 1;
        removeBtn.style.display = cards.length > 1 ? "inline-block" : "none";
      });
    }

    function addChild() {
      const clone = childTemplate.content.cloneNode(true);
      const card = clone.querySelector(".child-card");
      const skateSizeSelect = card.querySelector(".requested-skate-size");
      const ownSkatesCheckbox = card.querySelector(".has-own-skates");
      const languageRadios = card.querySelectorAll(".preferred-language");
      const languageGroupName = "preferred-language-" + Date.now() + "-" + Math.random().toString(36).slice(2);
      languageRadios.forEach((radio) => {
        radio.name = languageGroupName;
      });
      const removeBtn = card.querySelector(".remove-child-btn");

      ownSkatesCheckbox.addEventListener("change", () => {
        if (ownSkatesCheckbox.checked) {
          skateSizeSelect.value = "";
          skateSizeSelect.disabled = true;
        } else {
          skateSizeSelect.disabled = false;
        }
      });

      skateSizeSelect.addEventListener("change", () => {
        if (skateSizeSelect.value) {
          ownSkatesCheckbox.checked = false;
        }
      });

      removeBtn.addEventListener("click", () => {
        card.remove();
        updateChildNumbers();
      });

      childrenContainer.appendChild(clone);
      updateChildNumbers();
    }

    function collectChildren() {
      const cards = childrenContainer.querySelectorAll(".child-card");

      return Array.from(cards).map((card) => {
        const firstName = card.querySelector(".child-first-name").value.trim();
        const lastName = card.querySelector(".child-last-name").value.trim();

        const selectedLanguage = card.querySelector(".preferred-language:checked");

        return {
          first_name: firstName,
          last_name: lastName,
          // Backend/databasen bruker fortsatt child_name, så vi setter sammen
          // fornavn og etternavn før påmeldingen sendes.
          child_name: `${firstName} ${lastName}`.trim(),
          birth_date: card.querySelector(".birth-date").value,
          preferred_language: selectedLanguage ? selectedLanguage.value : "",
          other_information: card.querySelector(".other-information").value.trim() || null,
          requested_skate_size: card.querySelector(".requested-skate-size").value || null,
          has_own_skates: card.querySelector(".has-own-skates").checked
        };
      });
    }

    function validateChildren(children) {
      if (!children.length) {
        return "Du må legge til minst ett barn.";
      }

      for (let i = 0; i < children.length; i += 1) {
        const child = children[i];
        const nr = i + 1;

        if (!child.first_name) {
          return `Barn ${nr}: Du må fylle inn fornavn.`;
        }

        if (!child.last_name) {
          return `Barn ${nr}: Du må fylle inn etternavn.`;
        }

        if (!child.birth_date) {
          return `Barn ${nr}: Du må fylle inn fødselsdato.`;
        }

        if (!child.preferred_language) {
          return `Barn ${nr}: Du må velge ønsket språk.`;
        }

        if (!child.requested_skate_size && !child.has_own_skates) {
          return `Barn ${nr}: Du må velge skøytestørrelse eller krysse av for egne skøyter.`;
        }

        if (child.requested_skate_size && child.has_own_skates) {
          return `Barn ${nr}: Du kan ikke velge både størrelse og egne skøyter.`;
        }
      }

      return null;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessage();

      if (!ACTIVE_BATCH_NAME || ACTIVE_BATCH_NAME === "SETT INN NAVN PÅ AKTIVT PARTI HER") {
        showMessage("Du må sette riktig ACTIVE_BATCH_NAME i HTML-filen før siden kan brukes.");
        return;
      }

      const access_code = document.getElementById("access_code").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const children = collectChildren();

      if (!access_code) {
        showMessage("Du må fylle inn kode.");
        return;
      }

      if (!email) {
        showMessage("Du må fylle inn e-post.");
        return;
      }

      if (!phone) {
        showMessage("Du må fylle inn telefon.");
        return;
      }

      const childError = validateChildren(children);
      if (childError) {
        showMessage(childError);
        return;
      }

      try {
        form.classList.add("loading");

  <script>
    const ACTIVE_BATCH_NAME = "Høst 2026";

    const form = document.getElementById("signupForm");
    const childrenContainer = document.getElementById("childrenContainer");
    const addChildBtn = document.getElementById("addChildBtn");
    const submitBtn = document.getElementById("submitBtn");
    const messageBox = document.getElementById("message");
    const childTemplate = document.getElementById("childTemplate");

    function showMessage(text, type = "error") {
      messageBox.textContent = text;
      messageBox.className = `message ${type}`;
    }

    function clearMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    function updateChildNumbers() {
      const cards = childrenContainer.querySelectorAll(".child-card");
      cards.forEach((card, index) => {
        const numberEl = card.querySelector(".child-number");
        const removeBtn = card.querySelector(".remove-child-btn");
        numberEl.textContent = index + 1;
        removeBtn.style.display = cards.length > 1 ? "inline-block" : "none";
      });
    }

    function addChild() {
      const clone = childTemplate.content.cloneNode(true);
      const card = clone.querySelector(".child-card");
      const skateSizeSelect = card.querySelector(".requested-skate-size");
      const ownSkatesCheckbox = card.querySelector(".has-own-skates");
      const languageRadios = card.querySelectorAll(".preferred-language");
      const languageGroupName = "preferred-language-" + Date.now() + "-" + Math.random().toString(36).slice(2);
      languageRadios.forEach((radio) => {
        radio.name = languageGroupName;
      });
      const removeBtn = card.querySelector(".remove-child-btn");

      ownSkatesCheckbox.addEventListener("change", () => {
        if (ownSkatesCheckbox.checked) {
          skateSizeSelect.value = "";
          skateSizeSelect.disabled = true;
        } else {
          skateSizeSelect.disabled = false;
        }
      });

      skateSizeSelect.addEventListener("change", () => {
        if (skateSizeSelect.value) {
          ownSkatesCheckbox.checked = false;
        }
      });

      removeBtn.addEventListener("click", () => {
        card.remove();
        updateChildNumbers();
      });

      childrenContainer.appendChild(clone);
      updateChildNumbers();
    }

    function collectChildren() {
      const cards = childrenContainer.querySelectorAll(".child-card");

      return Array.from(cards).map((card) => {
        const firstName = card.querySelector(".child-first-name").value.trim();
        const lastName = card.querySelector(".child-last-name").value.trim();

        const selectedLanguage = card.querySelector(".preferred-language:checked");

        return {
          first_name: firstName,
          last_name: lastName,
          // Backend/databasen bruker fortsatt child_name, så vi setter sammen
          // fornavn og etternavn før påmeldingen sendes.
          child_name: `${firstName} ${lastName}`.trim(),
          birth_date: card.querySelector(".birth-date").value,
          preferred_language: selectedLanguage ? selectedLanguage.value : "",
          other_information: card.querySelector(".other-information").value.trim() || null,
          requested_skate_size: card.querySelector(".requested-skate-size").value || null,
          has_own_skates: card.querySelector(".has-own-skates").checked
        };
      });
    }

    function validateChildren(children) {
      if (!children.length) {
        return "Du må legge til minst ett barn.";
      }

      for (let i = 0; i < children.length; i += 1) {
        const child = children[i];
        const nr = i + 1;

        if (!child.first_name) {
          return `Barn ${nr}: Du må fylle inn fornavn.`;
        }

        if (!child.last_name) {
          return `Barn ${nr}: Du må fylle inn etternavn.`;
        }

        if (!child.birth_date) {
          return `Barn ${nr}: Du må fylle inn fødselsdato.`;
        }

        if (!child.preferred_language) {
          return `Barn ${nr}: Du må velge ønsket språk.`;
        }

        if (!child.requested_skate_size && !child.has_own_skates) {
          return `Barn ${nr}: Du må velge skøytestørrelse eller krysse av for egne skøyter.`;
        }

        if (child.requested_skate_size && child.has_own_skates) {
          return `Barn ${nr}: Du kan ikke velge både størrelse og egne skøyter.`;
        }
      }

      return null;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessage();

      if (!ACTIVE_BATCH_NAME || ACTIVE_BATCH_NAME === "SETT INN NAVN PÅ AKTIVT PARTI HER") {
        showMessage("Du må sette riktig ACTIVE_BATCH_NAME i HTML-filen før siden kan brukes.");
        return;
      }

      const access_code = document.getElementById("access_code").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const children = collectChildren();

      if (!access_code) {
        showMessage("Du må fylle inn kode.");
        return;
      }

      if (!email) {
        showMessage("Du må fylle inn e-post.");
        return;
      }

      if (!phone) {
        showMessage("Du må fylle inn telefon.");
        return;
      }

      const childError = validateChildren(children);
      if (childError) {
        showMessage(childError);
        return;
      }

      try {
        form.classList.add("loading");
        submitBtn.disabled = true;
        submitBtn.textContent = "Sender...";

        const response = await fetch("/.netlify/functions/create-school-signup-code", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            access_code,
            email,
            phone,
            batch_name: ACTIVE_BATCH_NAME,
            children
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Kunne ikke sende påmeldingen.");
        }

        showMessage("Påmeldingen ble registrert. Sender videre...", "success");

        window.location.href = data.redirect_url || "/betaling-fullfort-tkk.html";
      } catch (error) {
        showMessage(error.message || "Noe gikk galt. Prøv igjen.");
      } finally {
        form.classList.remove("loading");
        submitBtn.disabled = false;
        submitBtn.textContent = "Send påmelding";
      }
    });

    addChildBtn.addEventListener("click", addChild);

    addChild();
  </script>
